<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0 , user-scalable=no"/>
  <link rel="stylesheet" href="sousa_style.css">
  <title>Dynamic Image Viewer</title>  
</head>
  
<body>
  <div id="image-container">
    <img id="main-image" src="icon/image1.png" alt="Image">
  </div>
  
      <!-- Return button below the 3 main buttons -->
  <img id="exit-btn" src="icon/returnBtn2.png" alt="Exit" onclick="exitViewer()">

  <div id="controls">
    <!-- Row of navigation buttons -->
    <div class="button-row">
      <span id="back-wrapper" class="button-wrapper">
        <img id="back-btn" src="icon/back.png" alt="Back" onclick="goToPage(0)">
      </span>

      <span id="middle-wrapper" class="button-wrapper">
        <img id="middle-btn" src="icon/middle.png" alt="Middle" onclick="goToPage(1)">
      </span>

      <span id="next-wrapper" class="button-wrapper">
        <img id="next-btn" src="icon/next.png" alt="Next" onclick="goToPage(2)">
      </span>
    </div>


  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const selectedModelUrl = urlParams.get('model');

    const images = ["icon/image1.png", "icon/image2.png", "icon/image3.png"];
    let currentIndex = 0;

    const mainImage = document.getElementById("main-image");
    const backWrapper = document.getElementById("back-wrapper");
    const middleWrapper = document.getElementById("middle-wrapper");
    const nextWrapper = document.getElementById("next-wrapper");

    function updateImage() {
      mainImage.src = images[currentIndex];
      updateButtons();
    }

    function updateButtons() {
      backWrapper.classList.remove("active");
      middleWrapper.classList.remove("active");
      nextWrapper.classList.remove("active");

      if (currentIndex === 0) {
        backWrapper.classList.add("active");
      } else if (currentIndex === 1) {
        middleWrapper.classList.add("active");
      } else if (currentIndex === 2) {
        nextWrapper.classList.add("active");
      }
    }

    function goToPage(index) {
      if (index >= 0 && index < images.length) {
        currentIndex = index;
        updateImage();
      }
    }

    function exitViewer() {
      if (selectedModelUrl) {
        window.location.href = `model-viewer.html?model=${encodeURIComponent(selectedModelUrl)}`;
      } else {
        window.location.href = 'model-viewer.html';
      }
    }

    updateImage();
  </script>
</body>
</html>
