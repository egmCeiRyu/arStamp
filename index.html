<!doctype html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1 , user-scalable=no" />
  <link rel="stylesheet" href="https://use.typekit.net/zfi8dmc.css">
  <link rel="stylesheet" href="/style.css">
  <title>Firebase Auth Example</title>
</head>
  
<body>
    <div class="auth-container">
        <h1>Welcome Back</h1>
        <input type="email" id="email" placeholder="Email Address">
        <input type="password" id="password" placeholder="Password">
        
        <div class="button-group">
            <button onclick="signUp()">Sign Up</button>
            <button onclick="signIn()">Sign In</button>
        </div>
        
        <button onclick="signOutUser()" style="width: 100%; margin-top: 15px;">Sign Out</button>

        <p id="auth-status">Current User: Loading...</p>
    </div>
      <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
      <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    
      <script src="app.js"></script>
    </body>
</html>
