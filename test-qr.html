<!doctype html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <title>QR Test</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>

  <style>
    #qr-code-reader {
      width: 100%;
      height: 100vh;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <button onclick="window.startQrCodeScanner()">Abrir QR Scanner</button>

  <!-- ESTE DIV É O MAIS IMPORTANTE -->
  <div id="qr-code-reader">
      <div id="qr-reader" style="width:300px"></div>
  </div>

<script>
window.startQrCodeScanner = function () {
    const container = document.getElementById("qr-code-reader");
    container.style.display = "flex";  // ⚠️ se container for null → erro
     
    const html5QrCode = new Html5Qrcode("qr-reader");

    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },
        qrCodeMessage => {
            alert("QR detected: " + qrCodeMessage);
            html5QrCode.stop();
            container.style.display = "none";
        },
        errorMessage => { /* ignore */ }
    );
};
</script>

</body>
</html>
