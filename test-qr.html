<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner Oculto</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: #FFF5E1;
    }

    #scan-btn {
      font-size: 22px;
      padding: 15px 30px;
      background: #ffd54f;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }

    /* Vídeo invisível */
    #video {
      display: none;
    }
  </style>
</head>
<body>

<h2>Scanner de QR</h2>
<button id="scan-btn">📸 Abrir Câmera</button>
<video id="video"></video>

<script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
<script>
const scanBtn = document.getElementById('scan-btn');
const video = document.getElementById('video');
let qrScanner;

scanBtn.addEventListener('click', async () => {
    scanBtn.disabled = true; // evita cliques repetidos

    qrScanner = new QrScanner(video, result => {
        // Quando detecta, abre o link na mesma aba
        window.location.href = result;
        qrScanner.stop();
    }, {
        onDecodeError: error => {
            console.log('Ainda não detectado...');
        },
        maxScansPerSecond: 5
    });

    try {
        await qrScanner.start();
        console.log('Scanner iniciado em modo invisível');
    } catch(e) {
        alert('Erro ao acessar a câmera: ' + e);
        scanBtn.disabled = false;
    }
});
</script>
</body>
</html>
