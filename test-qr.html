<!DOCTYPE html>
<html lang="jp">
<head>
<meta charset="UTF-8">
<title>QR Scanner com Botão</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #FFF5E1;
    margin: 0;
    padding: 20px;
  }
  #scan-btn {
    font-size: 22px;
    padding: 15px 30px;
    background: #ffd54f;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  #result {
    margin-top: 20px;
    font-size: 18px;
    text-align: center;
  }
</style>
</head>
<body>

<h2>Scanner de QR</h2>
<button id="scan-btn">📸 Abrir Câmera</button>
<div id="result">Resultado aparecerá aqui</div>

<!-- Input oculto para abrir câmera nativa do iPhone/Android -->
<input type="file" accept="image/*" capture="environment" id="qr-input" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>
<script>
const scanBtn = document.getElementById("scan-btn");
const qrInput = document.getElementById("qr-input");
const resultDiv = document.getElementById("result");

// Quando clica no botão, abre a câmera
scanBtn.addEventListener("click", () => {
  qrInput.click();
});

// Quando usuário tira a foto do QR
qrInput.addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function() {
    const img = new Image();
    img.onload = function() {
      // Cria canvas temporário
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);

      // Lê QR
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code) {
        resultDiv.textContent = "QR detectado: " + code.data;
      } else {
        resultDiv.textContent = "Nenhum QR encontrado. Tente novamente.";
      }
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
