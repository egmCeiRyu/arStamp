<!DOCTYPE html>
<html lang="jp">
<head>
<meta charset="UTF-8">
<title>Scanner QR Ao Vivo</title>
<style>
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; margin:0; background:#FFF5E1; font-family:sans-serif; }
  #scan-btn { font-size:22px; padding:15px 30px; background:#ffd54f; border:none; border-radius:12px; cursor:pointer; }
  #video { display:none; width:300px; height:300px; margin-top:20px; border:2px solid #ccc; }
  #result { margin-top:20px; font-size:18px; text-align:center; }
</style>
</head>
<body>

<h2>Scanner de QR</h2>
<button id="scan-btn">📸 Abrir Câmera</button>
<video id="video"></video>
<div id="result">Resultado aparecerá aqui</div>

<script type="module">
import QrScanner from "https://cdn.jsdelivr.net/npm/qr-scanner@1.5.1/qr-scanner.min.js";

const scanBtn = document.getElementById('scan-btn');
const videoElem = document.getElementById('video');
const resultDiv = document.getElementById('result');

let qrScanner = null;

scanBtn.addEventListener('click', () => {
  if (!qrScanner) {
    qrScanner = new QrScanner(videoElem, result => {
      resultDiv.textContent = "QR detectado: " + result;
      qrScanner.stop();
      videoElem.style.display = 'none';
    }, {
      highlightScanRegion: true,
      highlightCodeOutline: true
    });
  }

  videoElem.style.display = 'block';
  qrScanner.start().catch(err => {
    alert("Erro ao acessar câmera: " + err);
  });
});
</script>

</body>
</html>
