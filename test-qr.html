<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner Simples</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      background-color: #FFF5E1;
    }

    #scan-btn {
      font-size: 22px;
      padding: 15px 30px;
      background: #ffd54f;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    video {
      width: 300px;
      height: 300px;
      border: 2px solid #ccc;
      border-radius: 12px;
      display: none; /* inicia oculto */
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h2>Scanner de QR</h2>
  <button id="scan-btn">📸 Abrir Câmera</button>
  <video id="video"></video>
  <div id="result"></div>

  <!-- Biblioteca QR Scanner (versão correta 1.4.2) -->
  <script src="https://cdn.jsdelivr.net/npm/qr-scanner@1.4.2/qr-scanner.umd.min.js"></script>
  <script>
    const scanBtn = document.getElementById('scan-btn');
    const video = document.getElementById('video');
    const resultDiv = document.getElementById('result');
    let qrScanner;

    scanBtn.addEventListener('click', async () => {
      scanBtn.style.display = 'none'; // esconde o botão
      video.style.display = 'block';  // mostra o vídeo

      // Cria o QR Scanner
      qrScanner = new QrScanner(video, result => {
        resultDiv.textContent = "QR Detectado: " + result;
        qrScanner.stop(); // para scanner depois de detectar
        video.style.display = 'none'; // esconde o vídeo
        scanBtn.style.display = 'block'; // mostra o botão novamente
      }, {
        onDecodeError: error => {
          console.log('Não detectado ainda...');
        },
        maxScansPerSecond: 5
      });

      // Inicia a câmera
      try {
        await qrScanner.start();
      } catch(e) {
        alert('Erro ao acessar a câmera: ' + e);
        scanBtn.style.display = 'block';
        video.style.display = 'none';
      }
    });
  </script>
</body>
</html>
