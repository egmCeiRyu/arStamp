<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <title>QR Scan Simples</title>

  <!-- Biblioteca para ler QR da imagem -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr/dist/jsQR.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    #scan-btn {
      font-size: 22px;
      padding: 15px 30px;
      background: #ffd54f;
      border: none;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>Scanner de QR</h2>

<!-- Botão -->
<button id="scan-btn">📸 Abrir Câmera</button>

<!-- Input escondido que abre a câmera do iPhone -->
<input type="file" accept="image/*" capture="environment" id="qr-input" style="display:none">

<script>
const qrBtn = document.getElementById("scan-btn");
const qrInput = document.getElementById("qr-input");

// Abre a câmera nativa do iPhone
qrBtn.addEventListener("click", () => {
  qrInput.click();
});

// Quando usuário tira foto do QR
qrInput.addEventListener("change", (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function() {
    const img = new Image();
    img.onload = function() {

      // Canvas temporário
      const canvas = document.createElement("canvas");
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0);

      // Lê QR
      const imageData = ctx.getImageData(0, 0, img.width, img.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code) {
        alert("QR detectado: " + code.data);
      } else {
        alert("Nenhum QR encontrado. Tente novamente.");
      }

    };
    img.src = reader.result;
  };

  reader.readAsDataURL(file);
});
</script>

</body>
</html>
