<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>3D Model Thumbnails</title>
  
  <link rel="stylesheet" href="https://use.typekit.net/zfi8dmc.css">
  
  <!-- HTML5 QR Code CDN FUNCIONAL -->
  <script src="https://unpkg.com/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      padding-bottom: 60px;
      background: #FFF5E1;
      max-width: 100%;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    .title {
      position: sticky;
      top: 0;
      display: flex;
      background: #FFF5E1;
      flex-wrap: wrap;
      font-family: "novecento-sans", sans-serif;
      color: #e0e0e0;
      margin:auto;
      width: 100%;
      text-align: center;
      overflow-y:auto;
    }

    .thumbnail-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      justify-items: center;
      background-color: rgb(247, 246, 240);
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      padding-bottom: 93px;
    }

    .thumbnail-img {
        width: 142px;
        height: 135px;
        object-fit: cover;
        display: block;
        margin: 0 auto;
    }

    .thumbnail-link {
      cursor: pointer;
      display: inline-block;
      text-align: center;
      padding: 5px;
      margin: 10px;
      background-color:#ffdbdb;
      border-radius: 103px;
    }

    .thumbnail-link.selected  {
      border: 6px solid rgba(252, 221, 91, 0.87);
      padding: 5px;
    }

    .titlebook{
      height: 144px;
      margin: auto;
    }

    .bottom-stripe{
      display: flex;
      bottom: 0;
      left: 0;
      z-index: 999;
      height: 91px;
      width: 100%;
      justify-content: center;
      position: fixed;
      background-color: #FFF5E1;
    }

    #bottom-actions {
        position: fixed;
        bottom: 25px; 
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 420px;
        padding: 0 10px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        z-index: 1000;
    }

    #view-model-btn-box {
        width: 120px;
        height: 120px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 0;
    }

    #view-model-btn {
        position: fixed;
        left: 50%; 
        transform: translateX(-50%); 
        bottom: 0%; 
        height: 150px;
        width: 150px;
        cursor: pointer;
        z-index: 1000;
    }

    #qr-code-btn-box {
        display: none; 
        justify-content: flex-start; 
        align-items: flex-end; 
        margin-right: 0; 
    }

    #qr-scanner-btn {
        background-color: rgba(255, 110, 204, 0.46);
        color: white;
        padding: 10px 8px;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        cursor: pointer;
        box-shadow: 0 2px 9px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s;
    }

    #qr-scanner-btn:hover {
        background-color: #e09634;
    }

    #qr-code-reader {
      width: 100%;
      height: 100vh;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
    }

    @media screen and (max-width: 1280px) {
      #qr-code-btn-box {
        display: flex;
      }
    }
  </style>
</head>

<body>

  <div class="title">
    <img src="thumbnails/titleStampBook.png" alt="logo" class="titlebook">
  </div>

  <div id="stamp-section">
    <div class="thumbnail-container" id="model-thumbnails">
      <!-- suas thumbnails aqui... -->
      <div class="thumbnail-link" data-model="models/model1.glb" data-name="model1">
        <img src="thumbnails/white_thumb.png" alt="Model 1" class="thumbnail-img">
      </div>
      <div class="thumbnail-link" data-model="models/model2.glb" data-name="model2">
        <img src="thumbnails/white_thumb.png" alt="Model 2" class="thumbnail-img">
      </div>
      <!-- continue com as demais thumbnails -->
    </div>
  </div>
  
  <div class="bottom-stripe">
    <div id="particleContainer" style="position:absolute;pointer-events:none;overflow:visible;z-index:9999;"></div>

    <div id="bottom-actions">
      <div id="qr-code-btn-box">
        <button id="qr-scanner-btn" onclick="window.startQrCodeScanner()">qrcode</button>
      </div>

      <div id="view-model-btn-box">
        <img src="icon/selectionIcon.png" id="view-model-btn">
      </div>
    </div>
  </div>

  <div id="qr-code-reader">
      <div id="qr-reader" style="width:300px"></div>
  </div>

  <!-- Firebase e lógica do seu app continuam intactas -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "...",
      authDomain: "...",
      projectId: "...",
      storageBucket: "...",
      messagingSenderId: "...",
      appId: "...",
      measurementId: "..."
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let selectedModelUrl = "";
    let selectedModelName = "";
    let currentUserId = null;

    const thumbnails = document.querySelectorAll('.thumbnail-link');
    const viewModelBtn = document.getElementById('view-model-btn');

    // Monitor de autenticação
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUserId = user.uid;
      } else {
        currentUserId = null;
      }
    });

    // Seleção de thumbnails
    thumbnails.forEach(thumb => {
      thumb.addEventListener('click', (event) => {
        const modelName = thumb.getAttribute('data-name');
        const imgElement = thumb.querySelector('.thumbnail-img');
        if (imgElement.src.endsWith('white_thumb.png')) {
          event.preventDefault();
          thumbnails.forEach(t => t.classList.remove('selected'));
          viewModelBtn.classList.remove('selected');
          selectedModelUrl = "";
          return;
        }
        thumbnails.forEach(t => t.classList.remove('selected'));
        thumb.classList.add('selected');
        selectedModelUrl = thumb.getAttribute('data-model');
        selectedModelName = thumb.getAttribute('data-name');
        viewModelBtn.classList.add('selected');
      });
    });

    // Botão de visualização
    viewModelBtn.addEventListener('click', () => {
      if (selectedModelUrl) {
        window.location.href = `model-viewer.html?model=${encodeURIComponent(selectedModelUrl)}`;
      }
    });

    // Função QR Code Scanner
    window.startQrCodeScanner = function () {
      const container = document.getElementById("qr-code-reader");
      container.style.display = "flex";

      const html5QrCode = new Html5Qrcode("qr-reader");

      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        async (decodedText) => {
          // Lógica de sucesso: salvar estampa
          if (currentUserId && decodedText) {
            const docRef = doc(db, "users", currentUserId);
            const docSnap = await getDoc(docRef);
            let stamps = [];
            if (docSnap.exists()) stamps = docSnap.data().stamps || [];
            if (!stamps.includes(decodedText)) {
              stamps.push(decodedText);
              await setDoc(docRef, { stamps: stamps }, { merge: true });
            }
          }

          html5QrCode.stop();
          container.style.display = "none";
          alert("QR Code detectado: " + decodedText);
          window.location.reload(); // recarrega para atualizar estampas
        },
        (errorMessage) => {}
      ).catch(err => {
        console.error("Erro ao iniciar QR scanner:", err);
        alert("Não foi possível acessar a câmera. Verifique permissões e HTTPS.");
      });
    };
  </script>

</body>
</html>
