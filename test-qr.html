<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <title>QR Scanner Seguro</title>
  <script type="module">
    import QrScanner from "https://unpkg.com/qr-scanner@1.5.1/qr-scanner.min.js";

    window.startQrScanner = () => {
      const video = document.createElement('video'); // vídeo invisível
      video.style.display = 'none';
      document.body.appendChild(video);

      const scanner = new QrScanner(
        video,
        result => {
          // 🔒 Redireciona apenas se for link HTTP/HTTPS
          if (result.startsWith('http://') || result.startsWith('https://')) {
            window.location.href = result;
          } else {
            alert('QR detectado, mas não é um link seguro:\n' + result);
          }
          scanner.stop();
          video.remove();
        },
        {
          // não mostra nenhum overlay
          highlightScanRegion: false,
          highlightCodeOutline: false
        }
      );

      scanner.start().catch(err => {
        console.error('Erro ao acessar câmera: ', err);
        alert('Não foi possível acessar a câmera. Verifique as permissões.');
        video.remove();
      });
    };
  </script>
  <style>
    #scan-btn {
      font-size: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      background-color: #ffd54f;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>QR Scanner Seguro</h2>
  <button id="scan-btn" onclick="startQrScanner()">📸 Abrir Câmera</button>
</body>
</html>
