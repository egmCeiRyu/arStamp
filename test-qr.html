<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>QR Code Test</title>

  <link rel="stylesheet" href="https://use.typekit.net/zfi8dmc.css">

  <style>
    /* Estilos do body e container principal */
    body {
      margin: 0;
      padding-bottom: 60px;
      background: #FFF5E1;
      max-width: 100%;
      overflow-x: hidden;
      touch-action: pan-y;
    }
    
    /* Container principal de visualização */
    #app-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      min-height: 100vh;
      box-sizing: border-box;
      padding-left: 10px;
      padding-right: 10px;
      background: #FFF5E1;
    }

    /* Estilos do título e miniaturas (mantidos) */
    .title {
      position: sticky;
      top: 0;
      display: flex;
      background: #FFF5E1;
      flex-wrap: wrap;
      margin: auto;
      width: 100%;
      text-align: center;
    }

    .titlebook {
      height: 144px;
      margin: auto;
    }
    
    .thumbnail-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      justify-items: center;
      background-color: rgb(247, 246, 240);
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      padding-bottom: 93px;
    }

    /* --- Botões de Ação Fixos --- */
    .bottom-stripe{
      display: flex;
      bottom: 0;
      left: 0;
      z-index: 999;
      height: 91px;
      width: 100%;
      justify-content: center;
      position: fixed;
      background-color: #FFF5E1;
    }

    #bottom-actions {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 420px;
      padding: 0 10px;
      box-sizing: border-box;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      z-index: 1000;
    }

    #qr-code-btn-box {
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
    }

    #qr-scanner-btn {
      background-color: rgba(255, 110, 204, 0.46);
      color: white;
      padding: 10px 8px;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      box-shadow: 0 2px 9px rgba(0, 0, 0, 0.1);
      transition: background-color 0.3s;
    }

    /* --- QR Scanner Tela Cheia --- */
    #qr-code-reader {
      width: 100%;
      height: 100vh;
      background: black;
      display: none; /* Começa oculto */
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
      padding: 0;
      box-sizing: border-box;
    }

    #qr-reader {
      width: 100%;
      max-width: 400px; /* Limita o tamanho do feed de vídeo */
      height: auto;
    }
    
    /* Estilo do botão de fechar */
    #close-qr-scanner-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.2);
        color: white;
        padding: 10px 15px;
        border: 1px solid white;
        border-radius: 8px;
        cursor: pointer;
        z-index: 2001;
        font-family: sans-serif;
        font-weight: bold;
    }

    @media screen and (max-width: 1280px) {
        #qr-code-btn-box {
            display: flex;
        }
    }
  </style>
</head>

<body>

  <div id="app-container">
    <div class="title">
      <img src="thumbnails/titleStampBook.png" alt="logo" class="titlebook">
    </div>

    <div class="thumbnail-container">
        <p style="text-align: center; width: 100%; color: #333;">Conteúdo Principal (Estampas)</p>
    </div>
  </div>

  <div class="bottom-stripe">
      <div id="bottom-actions">
          <div id="qr-code-btn-box">
              <button id="qr-scanner-btn" onclick="startQrCodeScanner()">qrcode</button>
          </div>
          </div>
  </div>

  <div id="qr-code-reader">
    <div id="qr-reader"></div> 
    
    <button id="close-qr-scanner-btn" onclick="stopQrCodeScanner()">FECHAR</button>
  </div>


  <script src="https://unpkg.com/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>

  <script>
  const qrReaderContainer = document.getElementById("qr-code-reader");
  let html5QrCode = null;

  function startQrCodeScanner() {
    
    // Ocultar o conteúdo principal antes de abrir o scanner
    document.getElementById('app-container').style.display = 'none';
    document.getElementById('bottom-actions').style.display = 'none';

    // 1. Mostrar a tela do scanner
    qrReaderContainer.style.display = "flex";

    // 2. Inicializar o scanner se ainda não tiver sido
    if (!html5QrCode) {
        // 'qr-reader' é o ID do div onde a câmera será renderizada
        html5QrCode = new Html5Qrcode("qr-reader");
    }
    
    const videoConstraints = {
        // Usar facingMode como preferência (melhor para iOS)
        facingMode: "environment"
    };

    const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 },
        disableFlip: false, // Importante para iOS
    };

    html5QrCode.start(
        videoConstraints,
        config,
        qrCodeMessage => {
            // Lógica de Sucesso: Mostra alerta e para o scanner
            alert("QR Code detectado: " + qrCodeMessage);
            stopQrCodeScanner(); // Chama a função para fechar tudo
        },
        errorMessage => {
            // Lógica de Erro contínuo (não crítico)
            // console.log(errorMessage);
        }
    ).catch(err => {
        // Lógica de Erro Crítico (Permissão Negada, Câmera Não Encontrada)
        alert("Erro ao iniciar a câmera. Verifique permissões (HTTPS obrigatório). Detalhe: " + err);
        stopQrCodeScanner();
    });
  }
  
  function stopQrCodeScanner() {
    // 1. Tenta parar ativamente o scanner se estiver rodando
    if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
            console.log("Scanner parado com sucesso.");
        }).catch(err => {
            console.warn("Erro ao parar o scanner, mas continuando o fechamento: ", err);
        });
    }

    // 2. Ocultar a tela do scanner
    qrReaderContainer.style.display = "none";
    
    // 3. Restaurar o conteúdo principal
    document.getElementById('app-container').style.display = 'block';
    document.getElementById('bottom-actions').style.display = 'flex';
  }
  </script>
</body>
</html>
