<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8">
  <title>QR Test</title>

  <!-- CDN CORRETA -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>

  <style>
    #qr-code-reader {
      width: 100%;
      height: 100vh;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
    }
  </style>
</head>
<body>

  <button onclick="startQrCodeScanner()">Abrir QR Scanner</button>

  <!-- DIV OBRIGATÓRIO -->
  <div id="qr-code-reader">
      <div id="qr-reader" style="width:300px"></div>
  </div>

<script>
let html5QrCode = null;

function startQrCodeScanner() {
    const container = document.getElementById("qr-code-reader");

    // Se já estiver rodando, para antes de reiniciar
    if (html5QrCode) {
        html5QrCode.stop().catch(err => console.warn("Erro ao parar QR scanner", err));
    }

    container.style.display = "flex";

    // Cria o scanner apenas se não existir
    if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
    }

    html5QrCode.start(
        { facingMode: "environment" },
        {
            fps: 10,
            qrbox: 250
        },
        qrCodeMessage => {
            alert("QR detected: " + qrCodeMessage);
            html5QrCode.stop().then(() => {
                container.style.display = "none";
            }).catch(err => console.error("Erro ao parar QR scanner", err));
        },
        errorMessage => {
            // console.log("QR scan error: ", errorMessage);
        }
    ).catch(err => {
        container.style.display = "none";
        alert("Erro ao acessar a câmera: " + err);
    });
}
</script>

</body>
</html>
