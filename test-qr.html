<!DOCTYPE html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>3D Model Thumbnails</title>
  
  <link rel="stylesheet" href="https://use.typekit.net/zfi8dmc.css">
  
  <!-- HTML5 QR Code CDN FUNCIONAL -->
  

  <style>
    body {
      margin: 0;
      padding-bottom: 60px;
      background: #FFF5E1;
      max-width: 100%;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    .title {
      position: sticky;
      top: 0;
      display: flex;
      background: #FFF5E1;
      flex-wrap: wrap;
      font-family: "novecento-sans", sans-serif;
      color: #e0e0e0;
      margin:auto;
      width: 100%;
      text-align: center;
      overflow-y:auto;
    }

    .thumbnail-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      justify-items: center;
      background-color: rgb(247, 246, 240);
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
      box-sizing: border-box;
      padding-bottom: 93px;
    }

    .thumbnail-img {
        width: 142px;
        height: 135px;
        object-fit: cover;
        display: block;
        margin: 0 auto;
    }

    .thumbnail-link {
      cursor: pointer;
      display: inline-block;
      text-align: center;
      padding: 5px;
      margin: 10px;
      background-color:#ffdbdb;
      border-radius: 103px;
    }

    .thumbnail-link.selected  {
      border: 6px solid rgba(252, 221, 91, 0.87);
      padding: 5px;
    }

    .titlebook{
      height: 144px;
      margin: auto;
    }

    .bottom-stripe{
      display: flex;
      bottom: 0;
      left: 0;
      z-index: 999;
      height: 91px;
      width: 100%;
      justify-content: center;
      position: fixed;
      background-color: #FFF5E1;
    }

    #bottom-actions {
        position: fixed;
        bottom: 25px; 
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: 420px;
        padding: 0 10px;
        box-sizing: border-box;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        z-index: 1000;
    }

    #view-model-btn-box {
        width: 120px;
        height: 120px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-right: 0;
    }

    #view-model-btn {
        position: fixed;
        left: 50%; 
        transform: translateX(-50%); 
        bottom: 0%; 
        height: 150px;
        width: 150px;
        cursor: pointer;
        z-index: 1000;
    }

    #qr-code-btn-box {
        display: none; 
        justify-content: flex-start; 
        align-items: flex-end; 
        margin-right: 0; 
    }

    #qr-scanner-btn {
        background-color: rgba(255, 110, 204, 0.46);
        color: white;
        padding: 10px 8px;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        cursor: pointer;
        box-shadow: 0 2px 9px rgba(0, 0, 0, 0.1);
        transition: background-color 0.3s;
    }

    #qr-scanner-btn:hover {
        background-color: #e09634;
    }

    #qr-code-reader {
      width: 100%;
      height: 100vh;
      background: black;
      display: none;
      justify-content: center;
      align-items: center;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2000;
    }

    @media screen and (max-width: 1280px) {
      #qr-code-btn-box {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <script src="https://unpkg.com/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>
  <button onclick="startQrCodeScanner()">Abrir QR Scanner</button>

  <div id="qr-code-reader">
    <div id="qr-reader" style="width:300px"></div>
  </div>

  <!-- Biblioteca primeiro -->
  <script src="https://unpkg.com/html5-qrcode@2.3.10/minified/html5-qrcode.min.js"></script>

  <!-- Seu código depois -->
  <script>
  function startQrCodeScanner() {
      const container = document.getElementById("qr-code-reader");
      container.style.display = "flex";

      const html5QrCode = new Html5Qrcode("qr-reader");

      html5QrCode.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 250 },
          qrCodeMessage => {
              alert("QR detected: " + qrCodeMessage);
              html5QrCode.stop();
              container.style.display = "none";
          },
          errorMessage => {}
      );
  }
  </script>
</body>
</html>
