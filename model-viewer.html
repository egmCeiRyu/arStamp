<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3D Model Viewer</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <link rel="stylesheet" href="modelviewer_style.css">
    <link rel="stylesheet" href="https://use.typekit.net/zfi8dmc.css">
    
    <style>
        /* Styles for touch/interaction optimization */
        #controls, label, button, .glass, .dim { touch-action: manipulation; }
        .hideDim { font: normal 12pt Arial; font-weight: 500; color: white; pointer-events: auto; border-radius: 115px; }
        
        /* Styles for full-screen overlay/iframe handling */
        body.no-scroll { overflow: hidden; position: fixed; width: 100%; height: 100%; top: 0; left: 0; }

        #iframeWrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; /* Mantido oculto por padrão */
            flex-direction: column; overflow-y: auto;
            -webkit-overflow-scrolling: touch; z-index: 9999;
            justify-content: center; align-items: center;
        }

        #iframeWrapper iframe {
            width: 85vw; height: 71vh; max-width: 546px;
            background-color: white; border: 1px solid #ccc;
            border-radius: 8px; overflow-y: auto;
        }
        
        /* Oculta o overlay de specs por padrão (se não for feito via class externa) */
        .spec-overlay { display: none; }
    </style>
</head>

<body>
    <model-viewer ar id="modelViewer"
        shadow-intensity="1"
        shadow-softness="1"
        camera-controls
        touch-action="pan-y, pan-x, none"
        camera-orbit="-25deg 75deg auto"
        scale="15 15 15"
        ar-scale="fixed"
        orbit-sensitivity="2"
        exposure="1.4"
        ar-modes="webxr scene-viewer quick-look"
        animation-name="Action"  autoplay>

        <img id="ar-button" src="icon/arbtn.png" slot="ar-button" alt="arbtn">
        <div id="controls">
            </div>
    </model-viewer>

    <div id="buttonsGRP">
        <a href="newMenu.html">
            </a>

        <a id="stampButtonLink">
            <img class="specification" src="icon/stamp.png" alt="Stamp Button" id="stampButtonImage">
        </a>

        <a id="controlsLink">
            </a>
    </div>

    <div id="arOverlay" class="ar-overlay">
        <div class="loadingText">
            </div>
    </div>

    <div class="spec-overlay" id="specOverlay">
        <h2>製品仕様</h2>

        <p>・概要 逆円錐型のケーシング内で回転するパドルによって 粉体に強力な衝撃・せん断力を与え、攪拌・分散し、 精密混合を行うバッチ式の高速せん断型混合機です。 ・特長 短い時間で均一な混合が可能</p>

        <a id="modelLink" href="#" target="_blank">製品仕様</a>

        <div id="iframeWrapper">
            <button id="closeIframeBtn">×</button>
            <iframe title="model" id="modelIframe"></iframe>
        </div>

        <img src="icon/returnbtn.png" class="return1" id="closeSpec">
        <br><br>
    </div>

 <script type="module">
    // =========================================================================
    // 1. 🌟 IMPORTS E CONFIGURAÇÃO FIREBASE
    // =========================================================================
    
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 🔑 SUA CONFIGURAÇÃO FIREBASE (DEVE SER IDÊNTICA AO newMenu.html)
    const firebaseConfig = {
         apiKey: "AIzaSyAM88d_Qu-_FFDf-NF7Ckk0eYYYKAZA3pU",
         authDomain: "stamp-edfc5.firebaseapp.com",
         projectId: "stamp-edfc5",
         storageBucket: "stamp-edfc5.firebasestorage.app",
         messagingSenderId: "522739532414",
         appId: "1:522739532414:web:047e4168251b5542ce8e2f",
         measurementId: "G-2EVLH3GZNS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); 

    // -------------------------------------------------------------------------
    // 2. 💾 FUNÇÃO DE BANCO DE DADOS (ESCRITA)
    // -------------------------------------------------------------------------

    async function addStampToFirebase(uid, modelName) {
        if (!uid) {
            console.error("UID não disponível. Não foi possível salvar o carimbo.");
            return;
        }
        
        try {
            const docRef = doc(db, "users", uid);
            const docSnap = await getDoc(docRef);
            let currentStamps = [];

            if (docSnap.exists()) {
                currentStamps = docSnap.data().stamps || [];
            }

            // Adiciona o novo carimbo se ele ainda não estiver na lista
            if (!currentStamps.includes(modelName)) {
                currentStamps.push(modelName);
                await updateDoc(docRef, {
                    stamps: currentStamps
                });
                console.log(`Carimbo '${modelName}' salvo no Firebase para o usuário ${uid}.`);
            } else {
                console.log(`Carimbo '${modelName}' já existe no Firebase.`);
            }

        } catch (error) {
            console.error("Erro ao salvar carimbo no Firebase:", error);
        }
    }

    // =========================================================================
    // 3. VARIÁVEIS, INICIALIZAÇÃO E LÓGICA EXISTENTE
    // =========================================================================
    
    // 3.1. Variáveis e Seletores
    const urlParams = new URLSearchParams(window.location.search);
    const modelUrl = urlParams.get('model');
    const modelViewer = document.getElementById('modelViewer');
    const arButton = document.getElementById('ar-button');
    const arOverlay = document.getElementById('arOverlay');
    const specOverlay = document.getElementById('specOverlay');
    const stampButtonLink = document.getElementById('stampButtonLink');
    const closeSpec = document.getElementById('closeSpec');
    const iframeWrapper = document.getElementById('iframeWrapper');
    const modelIframe = document.getElementById('modelIframe');
    const closeIframeBtn = document.getElementById('closeIframeBtn');
    const controlsLink = document.getElementById('controlsLink');

    let modelKey = "";
    
    // 3.2. Inicialização do Modelo e ModelKey
    if (modelUrl) {
        modelViewer.setAttribute('src', modelUrl);
        // Exemplo: 'models/model1.glb' -> 'model1'
        modelKey = modelUrl.split('/').pop().split('.')[0]; 
    }

    // -------------------------------------------------------------------------
    // 4. 🎯 LÓGICA DE CONQUISTA DO CARIMBO (NOVA IMPLEMENTAÇÃO FIREBASE)
    // -------------------------------------------------------------------------
    
    // O botão com a imagem stamp.png tem o ID 'stampButtonLink'
    stampButtonLink.addEventListener('click', async (event) => {
        event.preventDefault(); // Impede a ação padrão

        if (!modelKey) {
             console.error("Chave do modelo (modelKey) não definida.");
             return;
        }

        const user = auth.currentUser;

        if (user) {
            // USUÁRIO LOGADO: Salva o carimbo no Firebase
            await addStampToFirebase(user.uid, modelKey); 
            console.log(`Carimbo salvo para o modelo: ${modelKey}`);
            
        } else {
            // USUÁRIO DESLOGADO: Mantém a lógica antiga (opcional) ou avisa
            // A melhor prática seria redirecionar para a página de login (index.html)
            console.warn("Usuário não logado. O carimbo não será salvo permanentemente. Redirecionando para o menu.");
            // Lógica antiga (apenas para fallback, mas o Firebase é o alvo)
            // localStorage.setItem('thumbnailToUpdate', modelKey); 
        }

        // Redireciona para a página do menu (newMenu.html)
        window.location.href = 'newMenu.html';
    });

    // -------------------------------------------------------------------------
    // 5. LÓGICA DE SOBREPOSIÇÃO DE ESPECIFICAÇÕES (MANTIDA)
    // -------------------------------------------------------------------------
    
    closeSpec.addEventListener('click', () => {
        specOverlay.style.display = 'none';
        iframeWrapper.style.display = 'none';
        modelIframe.src = "";
    });

    closeIframeBtn.addEventListener('click', () => {
        iframeWrapper.style.display = 'none';
        modelIframe.src = '';
    });
    
    // -------------------------------------------------------------------------
    // 6. LÓGICA DE ATIVAÇÃO DO AR E EVENTOS (MANTIDA)
    // -------------------------------------------------------------------------

    let arJustStarted = false;
    let arTimeout = null;

    function startAR() {
        arOverlay.style.display = 'none';
        arJustStarted = false;
        modelViewer.activateAR();
    }

    arButton.addEventListener('click', (event) => {
        if (!modelViewer.canActivateAR) {
            console.log("AR não suportado no dispositivo/contexto.");
            return;
        }

        if (!arJustStarted) {
            event.preventDefault();
            event.stopPropagation();

            arOverlay.style.display = 'flex';
            arJustStarted = true;
            arTimeout = setTimeout(startAR, 2000);
        }
    });

    arOverlay.addEventListener('click', () => {
        if (arJustStarted) {
            clearTimeout(arTimeout);
            startAR();
        }
    });

    modelViewer.addEventListener('ar-status', (event) => {
        const status = event.detail.status;
        if (status === 'presenting') {
            modelViewer.play({ animationName: 'action' });
            console.log("Forçando animação 'action' no modo AR.");
        }
        if (status === 'not-presenting' || status === 'failed') {
            arOverlay.style.display = 'none';
            arJustStarted = false;
            clearTimeout(arTimeout);
        }
        
        // Lógica de ajuste de câmera e AR Shadow DOM (mantida)
        const shadowRoot = modelViewer.shadowRoot;
        if (shadowRoot) {
            const internalArButton = shadowRoot.querySelector('button[slot="ar-button"]');
            if (internalArButton) {
                internalArButton.style.display = (status === 'presenting') ? 'none' : '';
            }
        }
    });

    modelViewer.addEventListener('load', () => {
        const size = modelViewer.getDimensions();
        const maxDim = Math.max(size.x, size.y, size.z);
        const suggestedDistance = maxDim * 1.5;
        modelViewer.cameraOrbit = `0deg 75deg ${suggestedDistance}m`;
    });
            
</script>
    
    <script>
        // Funções para controle de scroll e iframe (não modulares)
        function showModel10() {
            const iframeWrapper = document.getElementById('iframeWrapper');
            iframeWrapper.style.display = 'flex';
            document.body.classList.add('no-scroll');
        }

        function hideIframe() {
            const iframeWrapper = document.getElementById('iframeWrapper');
            iframeWrapper.style.display = 'none';
            document.body.classList.remove('no-scroll');
        }
    </script>
</body>
</html>
