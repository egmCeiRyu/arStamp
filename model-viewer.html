<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>3D Model Viewer</title>
    
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
    
    <link rel="stylesheet" href="modelviewer_style.css">
    <link rel="stylesheet" href="https://use.typekit.net/zfi8dmc.css">
    
    <style>
        /* Styles for touch/interaction optimization */
        #controls, label, button, .glass, .dim { touch-action: manipulation; }
        .hideDim { font: normal 12pt Arial; font-weight: 500; color: white; pointer-events: auto; border-radius: 115px; }
        
        /* Styles for full-screen overlay/iframe handling */
        body.no-scroll { overflow: hidden; position: fixed; width: 100%; height: 100%; top: 0; left: 0; }

        #iframeWrapper {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            display: none; /* Mantido oculto por padrão */
            flex-direction: column; overflow-y: auto;
            -webkit-overflow-scrolling: touch; z-index: 9999;
            justify-content: center; align-items: center;
        }

        #iframeWrapper iframe {
            width: 85vw; height: 71vh; max-width: 546px;
            background-color: white; border: 1px solid #ccc;
            border-radius: 8px; overflow-y: auto;
        }
        
        /* Oculta o overlay de specs por padrão (se não for feito via class externa) */
        .spec-overlay { display: none; }
    </style>
</head>

<body>
    <model-viewer ar id="modelViewer"
        shadow-intensity="1"
        shadow-softness="1"
        camera-controls
        touch-action="pan-y, pan-x, none"
        camera-orbit="-25deg 75deg auto"
        scale="1 1 1"
        orbit-sensitivity="2"
        exposure="1.4"
        ar-modes="webxr scene-viewer quick-look">

        <img id="ar-button" src="icon/arbtn.png" slot="ar-button" alt="arbtn">
        <div id="controls">
            </div>
    </model-viewer>

    <div id="buttonsGRP">
        <a href="newMenu.html">
            </a>

        <a id="specButton">
            <img class="specification" src="icon/specbtn.png" alt="specification" >
        </a>

        <a id="controlsLink">
            </a>
        </div>

    <div id="arOverlay" class="ar-overlay">
        <div class="loadingText">
            </div>
    </div>

    <div class="spec-overlay" id="specOverlay">
        <h2>製品仕様</h2>

        <p>・概要 逆円錐型のケーシング内で回転するパドルによって 粉体に強力な衝撃・せん断力を与え、攪拌・分散し、 精密混合を行うバッチ式の高速せん断型混合機です。 ・特長 短い時間で均一な混合が可能</p>

        <a id="modelLink" href="#" target="_blank">製品仕様</a>

        <div id="iframeWrapper">
            <button id="closeIframeBtn">×</button>
            <iframe title="model" id="modelIframe"></iframe>
        </div>

        <img src="icon/returnbtn.png" class="return1" id="closeSpec">
        <br><br>
    </div>

    <script type="module">
        // 1. Variáveis e Seletores
        const urlParams = new URLSearchParams(window.location.search);
        const modelUrl = urlParams.get('model');
        const modelViewer = document.getElementById('modelViewer');
        const arButton = document.getElementById('ar-button');
        const arOverlay = document.getElementById('arOverlay');
        const specOverlay = document.getElementById('specOverlay');
        const specButton = document.getElementById('specButton');
        const closeSpec = document.getElementById('closeSpec');
        const iframeWrapper = document.getElementById('iframeWrapper');
        const modelIframe = document.getElementById('modelIframe');
        const closeIframeBtn = document.getElementById('closeIframeBtn');
        const controlsLink = document.getElementById('controlsLink');

        let modelKey = "";
        
        // 2. Inicialização do Modelo e ModelKey
        if (modelUrl) {
            modelViewer.setAttribute('src', modelUrl);
            // Obtém a chave do modelo (ex: 'models/model2.glb' -> 'model2')
            modelKey = modelUrl.split('/').pop().split('.')[0];
        }

        // 3. Lógica do Link de Controles (sousa.html)
        if (modelUrl) {
            controlsLink.href = `sousa.html?model=${encodeURIComponent(modelUrl)}`;
        } else {
            controlsLink.href = `sousa.html`;
        }

        // 4. Lógica de Sobreposição de Especificações (Abre e Fecha)
        specButton.addEventListener('click', () => {
            specOverlay.style.display = 'flex';
        });

        closeSpec.addEventListener('click', () => {
            specOverlay.style.display = 'none';
            iframeWrapper.style.display = 'none';
            modelIframe.src = "";
        });

        closeIframeBtn.addEventListener('click', () => {
            iframeWrapper.style.display = 'none';
            modelIframe.src = '';
        });
        
        // 5. Lógica de Carregamento de Especificações (via fetch)
        // Alterei a lógica para usar o fetch ('modelSpecs.json') e o fallback para o objeto interno
        const internalModelSpecs = {
            // Se o modelSpecs.json falhar, ele usará este objeto.
            model1: { title: "ACMパルベライザ", description: "Descrição 1", /* link: "..." */ },
            // ... adicione todos os 10 modelos aqui se o arquivo JSON for opcional
        };

        function updateSpecs(specs) {
            const spec = specs[modelKey];
            if (modelKey && spec) {
                specOverlay.querySelector('h2').textContent = spec.title;
                specOverlay.querySelector('p').textContent = spec.description;

                const modelLink = document.getElementById('modelLink');
                if (spec.link) {
                    modelLink.style.display = 'inline';
                    modelLink.onclick = (e) => {
                        e.preventDefault();
                        modelIframe.src = spec.link;
                        iframeWrapper.style.display = 'block';
                    };
                } else {
                    modelLink.style.display = 'none';
                }
            } else {
                specOverlay.querySelector('h2').textContent = "仕様情報がありません";
                specOverlay.querySelector('p').textContent = "このモデルの仕様はまだ登録されていません。";
                document.getElementById('modelLink').style.display = 'none';
            }
        }

        // Tentativa de carregar specs do JSON. Se falhar, usa o objeto interno.
        fetch('modelSpecs.json')
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(updateSpecs)
            .catch(() => {
                console.warn("Falha ao carregar modelSpecs.json. Usando dados internos.");
                updateSpecs(internalModelSpecs);
            });
            
        // 6. Lógica de Ativação do AR com Overlay
        let arJustStarted = false;
        let arTimeout = null;

        function startAR() {
            arOverlay.style.display = 'none';
            arJustStarted = false;
            modelViewer.activateAR();
        }

        arButton.addEventListener('click', (event) => {
            if (!arJustStarted) {
                event.preventDefault(); // Impede a ação padrão imediata
                event.stopPropagation();

                arOverlay.style.display = 'flex';
                arJustStarted = true;

                // Atraso de 2 segundos ANTES de iniciar o AR
                arTimeout = setTimeout(startAR, 2000);
            }
        });

        arOverlay.addEventListener('click', () => {
            if (arJustStarted) {
                clearTimeout(arTimeout);
                startAR();
            }
        });

        // 7. Eventos do Model Viewer (AR Status e Ocultar Botões)
        modelViewer.addEventListener('ar-status', (event) => {
            const status = event.detail.status;
            
            if (status === 'not-presenting') {
                arOverlay.style.display = 'none';
                arJustStarted = false;
                clearTimeout(arTimeout);
            }

            // Lógica para esconder o botão de AR nativo (screenshot) no shadow DOM
            const shadowRoot = modelViewer.shadowRoot;
            if (shadowRoot) {
                // Seleciona o botão AR que é gerado internamente
                const internalArButton = shadowRoot.querySelector('button[slot="ar-button"]');
                
                if (internalArButton) {
                    // Oculta o botão nativo apenas quando estiver em AR
                    internalArButton.style.display = (status === 'presenting') ? 'none' : '';
                }
            }
        });

        modelViewer.addEventListener('load', () => {
            // Ajuste da órbita da câmera
            const size = modelViewer.getDimensions();
            const maxDim = Math.max(size.x, size.y, size.z);
            const suggestedDistance = maxDim * 1.5; // Ajuste o fator para um zoom mais próximo
            modelViewer.cameraOrbit = `0deg 75deg ${suggestedDistance}m`;
        });
    </script>
    
    <script>
        // Funções para controle de scroll e iframe (não modulares)
        function showModel10() {
            const iframeWrapper = document.getElementById('iframeWrapper');
            iframeWrapper.style.display = 'flex';
            document.body.classList.add('no-scroll');
        }

        function hideIframe() {
            const iframeWrapper = document.getElementById('iframeWrapper');
            iframeWrapper.style.display = 'none';
            document.body.classList.remove('no-scroll');
        }
    </script>
</body>
</html>
