<script>
const qrCodeRegionId = "qr-code-reader";
    let html5QrCode = null;

    window.startQrCodeScanner = function() {
        // 🔑 Adicione esta verificação para parar o scanner se ele estiver ativo
        // Embora não seja a causa do "não funcionar", é uma boa prática.
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => {
                console.log("Scanner parado antes de reiniciar.");
            }).catch(err => {
                console.error("Erro ao tentar parar o scanner: ", err);
            });
        }
        
        // 1. Ocultar o conteúdo principal e as ações de baixo
        document.getElementById('stamp-section').style.display = 'none';
        document.getElementById('bottom-actions').style.display = 'none';

        let qrReaderContainer = document.getElementById(qrCodeRegionId);
        qrReaderContainer.style.display = 'flex'; // Usar 'flex' aqui, conforme o CSS

        // Garante que o scanner seja criado apenas uma vez por sessão
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode(qrCodeRegionId);
        }

        const config = {
            fps: 10,
            qrbox: { width: 250, height: 250 },
            disableFlip: false,
        };

        html5QrCode.start(
            { facingMode: "environment" },
            config,
            (decodedText, decodedResult) => {
                // ... (Lógica de sucesso) ...
            },
            (errorMessage) => {
                // ... (Lógica de erro contínuo) ...
            }
        ).catch((err) => {
            // 🚨 TRATAMENTO CRÍTICO DE ERRO/PERMISSÃO NEGADA 🚨
            
            // Reverte a interface:
            qrReaderContainer.style.display = 'none';
            document.getElementById('stamp-section').style.display = 'block';
            document.getElementById('bottom-actions').style.display = 'flex';
            
            // Notifica o usuário:
            let message = "Erro ao acessar a câmera. Verifique se você concedeu as permissões. Certifique-se também de estar em um ambiente **HTTPS**.";
            if (err.name === "NotAllowedError") {
                message = "Permissão de câmera negada. Atualize a página e conceda a permissão, ou verifique as configurações de privacidade do seu navegador.";
            } else if (err.name === "NotFoundError") {
                message = "Nenhuma câmera encontrada no dispositivo.";
            }
            alert(message);
            console.error("Erro ao iniciar a câmera: ", err);
        });
    };
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAM88d_Qu-_FFDf-NF7Ckk0eYYYKAZA3pU",
  authDomain: "stamp-edfc5.firebaseapp.com",
  projectId: "stamp-edfc5",
  storageBucket: "stamp-edfc5.firebasestorage.app",
  messagingSenderId: "522739532414",
  appId: "1:522739532414:web:047e4168251b5542ce8e2f",
  measurementId: "G-2EVLH3GZNS"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

let selectedModelUrl = "";
let selectedModelName = "";
let currentUserId = null;

const thumbnails = document.querySelectorAll('.thumbnail-link');
const viewModelBtn = document.getElementById('view-model-btn');

// Carrega estampas do Firebase
async function loadStampedModelsFromFirebase(uid) {
  if (!uid) return [];
  try {
    const docRef = doc(db, "users", uid);
    const docSnap = await getDoc(docRef);
    if (docSnap.exists()) {
      return docSnap.data().stamps || [];
    } else {
      await setDoc(docRef, { stamps: [] });
      return [];
    }
  } catch(e) { console.error(e); return []; }
}

// Renderiza estampas e anima apenas a nova
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    async function loadAndRenderStamps() {
      if (!currentUserId) return;
      const stampedModels = await loadStampedModelsFromFirebase(currentUserId);

      const newStamp = getQueryParam('newStamp'); // 🔑 modelo recém desbloqueado

      thumbnails.forEach(thumb => {
        const modelName = thumb.getAttribute('data-name');
        const imgElement = thumb.querySelector('.thumbnail-img');

        if (stampedModels.includes(modelName)) {
          imgElement.src = `thumbnails/${modelName}_thumb.png`;

          if (modelName === newStamp && !imgElement.classList.contains('stamped')) {
            imgElement.classList.add('stamp-unlock');
            imgElement.addEventListener('animationend', () => {
              imgElement.classList.remove('stamp-unlock');
            }, { once: true });
          }

          imgElement.classList.add('stamped');
        } else {
          imgElement.src = 'thumbnails/white_thumb.png';
        }
      });

      checkAllStamps(stampedModels);
    }
async function saveNewStampAndReload(modelName) {
    if (!currentUserId || !modelName) {
        // Se a estampa já está desbloqueada, apenas recarrega para fechar o scanner.
        window.location.reload(); 
        return;
    }

    const docRef = doc(db, "users", currentUserId);
    const docSnap = await getDoc(docRef);
    let stampedModels = [];

    if (docSnap.exists()) {
        stampedModels = docSnap.data().stamps || [];
    }

    if (!stampedModels.includes(modelName)) {
        stampedModels.push(modelName);
        await setDoc(docRef, { stamps: stampedModels }, { merge: true });

        // Redireciona na MESMA ABA, adicionando o parâmetro 'newStamp'
        window.location.href = window.location.pathname + `?newStamp=${modelName}`;
    } else {
        alert(`A estampa ${modelName} já foi desbloqueada!`);
        window.location.reload(); // Recarrega para fechar o scanner sem desbloquear
    }
}

// 🔑 EXPÕE A FUNÇÃO para ser chamada pelo scanner
window.handleQRCodeScan = async function(modelName) {
    await saveNewStampAndReload(modelName);
};
// Monitor de autenticação
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUserId = user.uid;
    loadAndRenderStamps();
  } else {
    currentUserId = null;
  }
});

// Lógica de seleção de miniaturas
thumbnails.forEach(thumb => {
  thumb.addEventListener('click', (event) => {
    const modelName = thumb.getAttribute('data-name');
    const imgElement = thumb.querySelector('.thumbnail-img');
    if (imgElement.src.endsWith('white_thumb.png')) {
      event.preventDefault();
      thumbnails.forEach(t => t.classList.remove('selected'));
      viewModelBtn.classList.remove('selected');
      selectedModelUrl = "";
      return;
    }
    thumbnails.forEach(t => t.classList.remove('selected'));
    thumb.classList.add('selected');
    selectedModelUrl = thumb.getAttribute('data-model');
    selectedModelName = thumb.getAttribute('data-name');
    viewModelBtn.classList.add('selected');
  });
});

// Botão de visualização
viewModelBtn.addEventListener('click', () => {
  if (selectedModelUrl) {
    window.location.href = `model-viewer.html?model=${encodeURIComponent(selectedModelUrl)}`;
  }
});
  
    function launchParticleExplosionOverButton(button) {
        const container = document.getElementById('particleContainer');
        container.style.display = 'block';

        // Posiciona o container no centro do botão
        const rect = button.getBoundingClientRect();
        container.style.position = 'fixed'; // importante para acompanhar o viewport
        container.style.left = rect.left + rect.width / 2 + 'px';
        container.style.top = rect.top + rect.height / 2 + 'px';
        container.style.width = '0px';
        container.style.height = '0px';
        container.style.pointerEvents = 'none';
        container.style.transform = 'translate(-50%, -50%)';

        const colors = ['#FFD700','#FFDC6E','#FFF5E1','#FFB800','#FFEE99'];
        const numParticles = 200;

        for (let i = 0; i < numParticles; i++) {
            const particle = document.createElement('div');
            const size = Math.random() * 10 + 4;
            particle.style.width = particle.style.height = size + 'px';
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            particle.style.position = 'absolute';
            particle.style.borderRadius = '50%';
            particle.style.left = '0px';
            particle.style.top = '0px';
            particle.style.pointerEvents = 'none';
            container.appendChild(particle);

            const angle = Math.random() * 2 * Math.PI;
            const distance = Math.random() * 300 + 100;
            const x = Math.cos(angle) * distance;
            const y = Math.sin(angle) * distance;
            const duration = Math.random() * 1 + 1.5;

            particle.animate([
                { transform: 'translate(0,0) scale(1)', opacity: 1 },
                { transform: `translate(${x}px, ${y}px) scale(0.3)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                easing: 'ease-out',
                fill: 'forwards'
            });

            setTimeout(() => particle.remove(), duration * 1000);
        }

    setTimeout(() => container.style.display = 'none', 3000);
}
// Checa todas as estampas
    function checkAllStamps(stampedModels) {
        const totalModels = thumbnails.length;
        if (stampedModels.length !== totalModels) return;
        if (document.getElementById("final-reward-btn")) return;

        const header = document.querySelector(".title");
        const imgBtn = document.createElement("img");
        imgBtn.id = "final-reward-btn";
        imgBtn.src = "icon/giftBTN.png";   
        imgBtn.style.cursor = "pointer";
        imgBtn.style.marginLeft = "50px";
        imgBtn.style.height = "auto";
        imgBtn.style.width = "150px";
        imgBtn.style.objectFit = "contain"; 
        imgBtn.addEventListener("click", () => {
            window.location.href = "https://www.pref.fukushima.lg.jp/site/portal-english/tiiki-kanko-en.html";
        });
        header.appendChild(imgBtn);

        // 🔹 Delay antes de lançar as partículas
        setTimeout(() => {
            launchParticleExplosionOverButton(imgBtn);
        }, 1000); // espera 1 segundo, você pode ajustar (ex: 1500ms)
    }
</script>
