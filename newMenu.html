<script type="module">
    // 1. 🌟 IMPORTS DO FIREBASE (App, Auth e Firestore)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // 2. 🔑 CONFIGURAÇÃO DO FIREBASE (Suas Chaves)
    const firebaseConfig = {
         apiKey: "AIzaSyAM88d_Qu-_FFDf-NF7Ckk0eYYYKAZA3pU",
         authDomain: "stamp-edfc5.firebaseapp.com",
         projectId: "stamp-edfc5",
         storageBucket: "stamp-edfc5.firebasestorage.app",
         messagingSenderId: "522739532414",
         appId: "1:522739532414:web:047e4168251b5542ce8e2f",
         measurementId: "G-2EVLH3GZNS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); // Usado para obter o UID
    // ----------------------------------------------------


    let selectedModelUrl = "";
    let selectedModelName = "";
    let currentUserId = null; // Armazena o ID do usuário logado

    const thumbnails = document.querySelectorAll('.thumbnail-link');
    const viewModelBtn = document.getElementById('view-model-btn');
    
    // ----------------------------------------------------
    // 3. 💾 FUNÇÕES DE BANCO DE DADOS (LEITURA)
    // ----------------------------------------------------

    async function loadStampedModelsFromFirebase(uid) {
        if (!uid) return [];

        try {
            const docRef = doc(db, "users", uid); // users/UID_DO_USUARIO
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                return docSnap.data().stamps || [];
            } else {
                console.log("Documento de carimbos não encontrado. Inicializando.");
                await setDoc(docRef, { stamps: [] }); // Cria o documento inicial
                return [];
            }
        } catch (error) {
            console.error("Erro ao carregar carimbos:", error);
            return [];
        }
    }

    // ----------------------------------------------------
    // 4. 🔗 LÓGICA DE AUTENTICAÇÃO E CARREGAMENTO
    // ----------------------------------------------------

    // Monitora o estado da autenticação para obter o UID
    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserId = user.uid; // Define o UID
            console.log(`Usuário logado. UID: ${currentUserId}`);
            // Quando o usuário loga, carrega e renderiza os carimbos
            loadAndRenderStamps(); 
        } else {
            currentUserId = null;
            // Se o usuário deslogar, você pode querer limpar ou redirecionar
            console.log("Usuário deslogado.");
            // Opcional: window.location.href = 'index.html'; 
        }
    });

    // Função principal que carrega do Firebase e atualiza o HTML
    async function loadAndRenderStamps() {
        if (!currentUserId) return; 

        // 🎯 CHAMA A FUNÇÃO FIREBASE PARA OBTER OS CARIMBOS
        const stampedModels = await loadStampedModelsFromFirebase(currentUserId);
        
        // --- LÓGICA DE RENDERIZAÇÃO DAS MINIATURAS ---
        thumbnails.forEach(thumb => {
            const modelName = thumb.getAttribute('data-name');
            const imgElement = thumb.querySelector('.thumbnail-img');

            if (stampedModels.includes(modelName)) {
                // O modelo está carimbado: mostra a imagem colorida
                imgElement.src = `thumbnails/${modelName}_thumb.png`;
            } else {
                // O modelo NÃO está carimbado: garante que é a imagem branca
                imgElement.src = 'thumbnails/white_thumb.png';
            }
        });

        // Limpa a chave temporária do localStorage (para migração)
        localStorage.removeItem('thumbnailToUpdate');
        
        // 5. VERIFICA A RECOMPENSA FINAL
        checkAllStamps(stampedModels); 
    }
    
    // ----------------------------------------------------
    // 6. LÓGICA DE SELEÇÃO DE MINIATURA (AGORA SÓ DEPOIS DE CARREGADO)
    // ----------------------------------------------------

    thumbnails.forEach(thumb => {
        thumb.addEventListener('click', (event) => {
            // Obter a miniatura atual
            const modelName = thumb.getAttribute('data-name');
            const imgElement = thumb.querySelector('.thumbnail-img');

            // Verifica se o modelo está usando a imagem padrão (não carimbado)
            // Isso bloqueia o clique para miniaturas não carimbadas.
            if (imgElement.src.endsWith('white_thumb.png')) { 
                event.preventDefault(); // Impede qualquer navegação padrão

                console.log('Modelo não carimbado, seleção bloqueada.');

                // Opcional: Adicionar feedback visual de bloqueio/desseleção
                thumbnails.forEach(t => t.classList.remove('selected'));
                viewModelBtn.classList.remove('selected');
                selectedModelUrl = ""; // Garante que o botão de visualização não faça nada

                return; // Sai da função, impedindo a seleção
            }

            // Se a execução chegou aqui, o modelo está carimbado e é clicável.

            // Remove a classe 'selected' de todas as miniaturas
            thumbnails.forEach(t => t.classList.remove('selected'));
            // Adiciona a classe 'selected' à miniatura clicada
            thumb.classList.add('selected');

            selectedModelUrl = thumb.getAttribute('data-model');
            selectedModelName = thumb.getAttribute('data-name');

            // Ativa o botão de visualização com o efeito de pulso
            viewModelBtn.classList.add('selected');
        });
    });

    // 7. LÓGICA DO BOTÃO DE VISUALIZAÇÃO (MANTIDA)
    viewModelBtn.addEventListener('click', () => {
      if (selectedModelUrl) {
        // Você pode adicionar um log de evento do Firebase Analytics se desejar:
        // logEvent(analytics, "button_click", { button_name: selectedModelName });
        window.location.href = `model-viewer.html?model=${encodeURIComponent(selectedModelUrl)}`;
      }
    });
    
    // 8. 🎉 BOTÃO FINAL QUANDO TODOS OS CARIMBOS FOREM CONQUISTADOS
    function checkAllStamps(stampedModels) {
      const totalModels = thumbnails.length;
      const allComplete = stampedModels.length === totalModels;

      // Se não completou tudo → não cria o botão
      if (!allComplete) return;

      // Evita duplicação
      if (document.getElementById("final-reward-btn")) return;

      const header = document.querySelector(".title");

      // 👉 Criar o botão-imagem
      const imgBtn = document.createElement("img");
      imgBtn.id = "final-reward-btn";
      imgBtn.src = "icon/dim_off.png";   
      imgBtn.style.cursor = "pointer";
      imgBtn.style.marginLeft = "50px";
      imgBtn.style.height = "auto";
      imgBtn.style.width = "150px";
      imgBtn.style.objectFit = "contain"; 

      // Ação ao clicar
      imgBtn.addEventListener("click", () => {
          window.location.href = "https://www.pref.fukushima.lg.jp/site/portal-english/tiiki-kanko-en.html"; // 🟡 altere para sua página
      });

      header.appendChild(imgBtn);
    }
    
    // OBS: O evento DOMContentLoaded foi substituído pela chamada 'loadAndRenderStamps'
    // dentro do onAuthStateChanged, garantindo que o UID esteja disponível.

</script>
