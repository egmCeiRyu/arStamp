<!doctype html>
<html lang="jp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1 , user-scalable=no" />
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://use.typekit.net/zfi8dmc.css">
  <link rel="stylesheet" href="newmenu_style.css">
  <title>3D Model Thumbnails</title>
  
  <style>
    /* Pulse Animation */
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 158, 0, 0.78); }
      70% { transform: scale(1); box-shadow: 0 0 0 13px rgba(204, 169, 44, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(204, 169, 44, 0); }
    }

    #view-model-btn.selected {
      animation: pulse 1.3s infinite;
      border-radius: 93px;
      padding: 0px;
    }
  </style>
</head>

<body>
  <div class="title">
    <img src="icon/arbtn.png" alt="logo" class="companylogo">
  </div>

  <div class="thumbnail-container" id="model-thumbnails">
    <!-- Models -->
    <div class="thumbnail-link" data-model="models/model1.glb" data-name="model1">
      <img src="thumbnails/model1_thumb.png" alt="Model 1" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model2.glb" data-name="model2">
      <img src="thumbnails/white_thumb.png" alt="Model 2" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model3.glb" data-name="model3">
      <img src="thumbnails/white_thumb.png" alt="Model 3" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model4.glb" data-name="model4">
      <img src="thumbnails/white_thumb.png" alt="Model 4" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model5.glb" data-name="model5">
      <img src="thumbnails/white_thumb.png" alt="Model 5" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model6.glb" data-name="model6">
      <img src="thumbnails/white_thumb.png" alt="Model 6" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model7.glb" data-name="model7">
      <img src="thumbnails/white_thumb.png" alt="Model 7" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model8.glb" data-name="model8">
      <img src="thumbnails/white_thumb.png" alt="Model 8" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model9.glb" data-name="model9">
      <img src="thumbnails/white_thumb.png" alt="Model 9" class="thumbnail-img">
    </div>
    <div class="thumbnail-link" data-model="models/model10.glb" data-name="model10">
      <img src="thumbnails/white_thumb.png" alt="Model 10" class="thumbnail-img">
    </div>
  </div>

  <div class="bottom-stripe"></div>

  <script type="module">
    // --- FIREBASE ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.3/firebase-app.js";
    import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/11.7.3/firebase-analytics.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.7.3/firebase-firestore.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.7.3/firebase-auth.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUserUID = null;

    // Login anônimo
    signInAnonymously(auth).catch(console.error);
    onAuthStateChanged(auth, user => {
      if (user) {
        currentUserUID = user.uid;
        loadStampedModels();
      }
    });

    const thumbnails = document.querySelectorAll('.thumbnail-link');

    async function loadStampedModels() {
      if (!currentUserUID) return;

      const userDocRef = doc(db, "userStampedModels", currentUserUID);
      const docSnap = await getDoc(userDocRef);
      let stampedModels = [];
      if (docSnap.exists()) stampedModels = docSnap.data().models || [];

      thumbnails.forEach(thumb => {
        const name = thumb.getAttribute('data-name');
        const img = thumb.querySelector('.thumbnail-img');
        if (stampedModels.includes(name)) {
          img.src = `thumbnails/${name}_thumb.png`;
        } else {
          img.src = "thumbnails/white_thumb.png";
        }
      });
    }

    // Clique na thumbnail abre model-viewer e salva no Firebase
    thumbnails.forEach(thumb => {
      thumb.addEventListener('click', async () => {
        if (!currentUserUID) return;

        const modelName = thumb.getAttribute('data-name');
        const modelUrl = thumb.getAttribute('data-model');

        // Atualiza Firestore
        const userDocRef = doc(db, "userStampedModels", currentUserUID);
        const docSnap = await getDoc(userDocRef);
        if (docSnap.exists()) {
          await updateDoc(userDocRef, { models: arrayUnion(modelName) });
        } else {
          await setDoc(userDocRef, { models: [modelName] });
        }

        // Atualiza a miniatura local
        thumb.querySelector('.thumbnail-img').src = `thumbnails/${modelName}_thumb.png`;

        // Vai para model-viewer
        window.location.href = `model-viewer.html?model=${encodeURIComponent(modelUrl)}`;
      });
    });
  </script>
</body>
</html>
