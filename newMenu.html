        /* Pulse Animation */
    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(252, 221, 91, 0.87);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 13px rgba(204, 169, 44, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(204, 169, 44, 0);
      }
    }

    #view-model-btn.selected {
      animation: pulse 1.3s infinite;
      border-radius: 9px;
      border-radius: 93px;
      padding: 0px;
    }
  </style>

</head>

<script type="module">
     //1. FIREBASE (MANTIDA)
    //import { initializeApp } from "https://www.gstatic.com/firebasejs/11.7.3/firebase-app.js";
    //import { getAnalytics, logEvent } from "https://www.gstatic.com/firebasejs/11.7.3/firebase-analytics.js";
    //import { firebaseConfig } from "./firebase-config.js";
//
    //const app = initializeApp(firebaseConfig);
    //const analytics = getAnalytics(app);

    let selectedModelUrl = "";
    let selectedModelName = "";

    const thumbnails = document.querySelectorAll('.thumbnail-link');
    const viewModelBtn = document.getElementById('view-model-btn');

    // 2. LÓGICA DE SELEÇÃO DE MINIATURA (CORRIGIDA)
    thumbnails.forEach(thumb => {
      thumb.addEventListener('click', (event) => {

        // 🛑 NOVO CÓDIGO DE VERIFICAÇÃO 🛑
        const imgElement = thumb.querySelector('.thumbnail-img');
        // Verifica se a imagem é a 'white_thumb.png' (não carimbada)
        if (imgElement.src.includes('white_thumb.png')) {
          event.preventDefault(); // Impede a ação padrão

          // Opcional: Adicionar feedback visual ou alerta
          console.log('Modelo não carimbado, seleção bloqueada.');
          // Opcional: Desselecionar qualquer botão selecionado, se houver.
          thumbnails.forEach(t => t.classList.remove('selected'));
          viewModelBtn.classList.remove('selected');

          return; // Sai da função de clique
        }
        // 🛑 FIM DO NOVO CÓDIGO 🛑

        // Se a execução chegou aqui, o modelo está carimbado e é clicável.
        thumbnails.forEach(t => t.classList.remove('selected'));
        thumb.classList.add('selected');

        selectedModelUrl = thumb.getAttribute('data-model');
        selectedModelName = thumb.getAttribute('data-name');

        viewModelBtn.classList.add('selected');
      });
    });

    // 3. LÓGICA DO BOTÃO DE VISUALIZAÇÃO (MANTIDA)
    viewModelBtn.addEventListener('click', () => {
      if (selectedModelUrl) {
        //logEvent(analytics, "button_click", { button_name: selectedModelName });
        window.location.href = `model-viewer.html?model=${encodeURIComponent(selectedModelUrl)}`;
      }
    });
    
    // 4. 🎯 LÓGICA DO CARIMBO: Carregar estado salvo e atualizar miniaturas
    document.addEventListener('DOMContentLoaded', () => {
        // Tenta carregar a lista de modelos carimbados. Se não houver nada, usa array vazio.
        const stampedModels = JSON.parse(localStorage.getItem('stampedModels') || '[]');
        
        // Se houver um modelo que acabou de ser carimbado (do script antigo),
        // ele é adicionado à lista para compatibilidade, mas o foco é na lista 'stampedModels'.
        const modelToUpdate = localStorage.getItem('thumbnailToUpdate');
        
        if (modelToUpdate && !stampedModels.includes(modelToUpdate)) {
            // Isso não deve acontecer se model-viewer.html estiver atualizado, mas garante a migração.
            stampedModels.push(modelToUpdate);
            localStorage.setItem('stampedModels', JSON.stringify(stampedModels));
        }
        
        thumbnails.forEach(thumb => {
            const modelName = thumb.getAttribute('data-name'); // Ex: 'model1', 'model2'
            const imgElement = thumb.querySelector('.thumbnail-img');

            if (stampedModels.includes(modelName)) {
                // O modelo está carimbado: mostra a imagem colorida
                imgElement.src = `thumbnails/${modelName}_thumb.png`;
            } else {
                // O modelo NÃO está carimbado: garante que é a imagem branca
                imgElement.src = 'thumbnails/white_thumb.png';
            }
        });

        // Limpa a chave temporária (do script anterior)
        localStorage.removeItem('thumbnailToUpdate');
    });
  
  // 5. 🎉 BOTÃO FINAL QUANDO TODOS OS CARIMBOS FOREM CONQUISTADOS
// 5. 🎉 BOTÃO FINAL COM IMAGEM QUANDO TODOS OS CARIMBOS FOREM CONQUISTADOS
    function checkAllStamps() {
        const stampedModels = JSON.parse(localStorage.getItem("stampedModels") || "[]");

        const totalModels = thumbnails.length;
        const allComplete = stampedModels.length === totalModels;

        // Se não completou tudo → não cria o botão
        if (!allComplete) return;

        // Evita duplicação
        if (document.getElementById("final-reward-btn")) return;

        const header = document.querySelector(".title");

        // 👉 Criar o botão-imagem
        const imgBtn = document.createElement("img");
        imgBtn.id = "final-reward-btn";
        imgBtn.src = "icon/dim_off.png";   // 🔵 ALTERE AQUI PARA SUA IMAGEM
        imgBtn.style.cursor = "pointer";
        imgBtn.style.marginLeft = "50px";
        imgBtn.style.height = "auto";
        imgBtn.style.width = "150px";
        imgBtn.style.objectFit = "contain"; 

        // Ação ao clicar
        imgBtn.addEventListener("click", () => {
            window.location.href = "https://www.pref.fukushima.lg.jp/site/portal-english/tiiki-kanko-en.html"; // 🟡 altere para sua página
        });

        header.appendChild(imgBtn);
    }

    document.addEventListener("DOMContentLoaded", checkAllStamps);

</script>
    
</body>
